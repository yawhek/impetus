name: impetus
description: Framework mobile per l'analisi del movimento nel fitness e nella kickboxing.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.6.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_analytics: ^12.4.1

  path_provider: ^2.1.3
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
