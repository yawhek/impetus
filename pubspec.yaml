name: impetus
description: IMPETUS - Sistema di analisi cinematica e coaching AI per kickboxing.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  hive: ^2.2.3
  hive_flutter: ^1.1.0



  flutter_card_swiper: ^3.0.0

  # --- DIPENDENZE BASE ---
  cupertino_icons: ^1.0.6

  fl_chart: ^0.66.0

  # --- FOTOCAMERA ---
  camera: ^0.10.5+9

  # --- AI & VISIONE (ML KIT) ---
  # Questa versione 0.11.0 risolve l'errore "Namespace" che avevi prima
  google_mlkit_pose_detection: ^0.14.1 

  # --- PERMESSI ---
  permission_handler: ^11.0.1



  google_generative_ai: ^0.4.7
  flutter_markdown: ^0.6.20
  flutter_riverpod: ^2.6.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1

  firebase_messaging: ^16.2.2
  firebase_analytics: ^12.4.1

  # --- GESTIONE VIDEO E FILE ---
  path_provider: ^2.1.3
  intl: ^0.19.0
  google_fonts: ^6.1.0
  animations: ^2.0.11
  visibility_detector: ^0.4.0
  flutter_secure_storage: ^9.0.0

  # NOTA: Ho rimosso "multidex" da qui perché va solo nel build.gradle (dove l'hai già messo).

  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.13.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icona_app.png"
  adaptive_icon_foreground: "assets/icon/icona_app.png"
  adaptive_icon_background: "assets/icon/icona_sfondo.png"
